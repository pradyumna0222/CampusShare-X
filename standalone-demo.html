<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb">
<title>CampusShare X — Standalone Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
<style>
.icon-glyph{display:inline-grid;place-items:center;width:20px;height:20px;font-size:18px;line-height:1}.brand-mark .icon-glyph{font-size:21px}.nav-link .icon-glyph{color:#8d98ad}.nav-link.active .icon-glyph{color:#6654df}.hero-chip .icon-glyph{width:14px;height:14px;font-size:13px}.hero-search>.icon-glyph{color:#8b80eb}.hero-search input{min-width:0}.button .icon-glyph{width:auto;height:auto;font-size:13px}.resource-icon-large .icon-glyph{font-size:38px;width:44px;height:44px}.resource-visual .icon-glyph{font-size:25px}.inventory-icon .icon-glyph{font-size:21px}.stat-icon .icon-glyph{font-size:20px}.smartmatch-icon .icon-glyph{font-size:24px}.detail-art .icon-glyph{font-size:49px}.hidden{display:none!important}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter-chip{border:1px solid #e6eaf2;background:white;color:#788399;border-radius:7px;padding:7px 10px;font-size:10px}.filter-chip.active{background:#efedff;border-color:#e2ddff;color:#6654df;font-weight:800}.demo-callout{border:1px dashed #d9d4ff;background:#faf9ff;color:#7c75a8;padding:10px 12px;border-radius:8px;font-size:9px;line-height:1.5;margin-top:14px}.resource-card-art:after{content:'';position:absolute;inset:auto 0 0;height:25px;background:linear-gradient(transparent,rgba(255,255,255,.15))}.tag-row{display:flex;gap:5px;flex-wrap:wrap}.standalone-actions{display:flex;gap:8px;flex-wrap:wrap}.error-note{font-size:10px;color:#bd4b5e;margin-top:7px}.empty-list{padding:25px;text-align:center;color:#9099aa;font-size:11px}.field-help{font-size:9px;color:#939caf;line-height:1.5}.full-width{width:100%}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-zone"></div>
<div id="modal-zone"></div>
<script>
(()=>{
const KEY='campushare-x-standalone-v1';
const now=new Date();const date=(plus=0)=>{const d=new Date();d.setDate(d.getDate()+plus);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dateFor=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const uid=p=>p+'-'+Math.random().toString(36).slice(2,8);const iso=()=>new Date().toISOString();
const users={student:{id:'student-1',name:'Aarav Menon',title:'Student · CSE',initials:'AM'},owner:{id:'owner-1',name:'Dr. Meera Iyer',title:'Resource owner',initials:'MI'},admin:{id:'admin-1',name:'Nikhil Rao',title:'Campus administrator',initials:'NR'}};
const trained={'student-1':[],'student-2':['lab-safety'],'student-3':[]};
const resources=[
{id:'esp32',name:'ESP32 IoT Starter Kit',category:'Electronics',desc:'Wi-Fi and Bluetooth development board with prototyping accessories.',location:'Innovation Lab · B-204',ownerId:'owner-1',owner:'Dr. Meera Iyer',tags:['iot','microcontroller','sensor','programming','prototype','electronics'],training:[],status:'available',icon:'⌘',gradient:'violet',asset:'CSX-EL-042',uses:28,instructions:'Return all jumper wires and sensors to the labelled tray. Do not connect external power above the kit rating.'},
{id:'sensor',name:'Sensor & Breadboard Kit',category:'Electronics',desc:'Breadboard, jump wires, LEDs, resistors and environmental sensors.',location:'Innovation Lab · B-204',ownerId:'owner-1',owner:'Dr. Meera Iyer',tags:['iot','sensor','prototype','circuit','electronics','breadboard'],training:[],status:'available',icon:'⚡',gradient:'amber',asset:'CSX-EL-057',uses:34,instructions:'Count components before returning. Keep modules in the compartmented case.'},
{id:'meter',name:'Digital Multimeter',category:'Testing',desc:'Handheld instrument for electrical measurement and circuit debugging.',location:'Electronics Store · C-110',ownerId:'owner-1',owner:'Dr. Meera Iyer',tags:['testing','measurement','voltage','circuit','debugging','electronics'],training:[],status:'available',icon:'⌁',gradient:'blue',asset:'CSX-TM-014',uses:19,instructions:'Inspect probe insulation before use. Return probes with the instrument.'},
{id:'scope',name:'Digital Oscilloscope',category:'Testing',desc:'Bench oscilloscope for signal, timing and communication debugging.',location:'Advanced Electronics Lab · C-212',ownerId:'owner-1',owner:'Dr. Meera Iyer',tags:['testing','signal','measurement','circuit','debugging','electronics'],training:['lab-safety'],status:'available',icon:'〰',gradient:'teal',asset:'CSX-TM-006',uses:12,instructions:'Lab safety induction required. Use approved probes and rated limits.'},
{id:'camera',name:'DSLR Camera Kit',category:'Media',desc:'Camera, standard lens, battery, charger and tripod for project documentation.',location:'Media Desk · A-105',ownerId:'owner-1',owner:'Media Services',tags:['video','camera','recording','documentation','photography'],training:[],status:'available',icon:'▣',gradient:'rose',asset:'CSX-MD-021',uses:42,instructions:'Keep the lens cap on when not in use. Return the battery and charger.'},
{id:'laptop',name:'Development Laptop',category:'Computing',desc:'Configured laptop for coding, embedded tooling and project demos.',location:'Computing Hub · D-301',ownerId:'owner-1',owner:'Computing Services',tags:['programming','development','iot','coding','prototype','computing'],training:[],status:'available',icon:'▱',gradient:'indigo',asset:'CSX-IT-018',uses:25,instructions:'Save work to your own storage. Sign out of accounts before return.'},
{id:'room',name:'Project Collaboration Room',category:'Spaces',desc:'Four-person project room with display, whiteboard and video-call setup.',location:'Learning Commons · Level 2',ownerId:'owner-1',owner:'Campus Facilities',tags:['meeting','team','presentation','collaboration','project'],training:[],status:'available',icon:'⌂',gradient:'green',asset:'CSX-SP-011',uses:31,instructions:'Leave the room ready for the next group and clear the whiteboard.'},
{id:'solder',name:'Soldering Workstation',category:'Lab equipment',desc:'Supervised soldering station with fume extraction and basic hand tools.',location:'Fabrication Lab · F-108',ownerId:'owner-1',owner:'Maker Lab Team',tags:['electronics','soldering','circuit','prototype','fabrication'],training:['soldering-safety'],status:'maintenance',icon:'⚒',gradient:'slate',asset:'CSX-FB-009',uses:16,instructions:'Training and staff supervision required. Currently marked for maintenance.'}
];
function seed(){return {resources:structuredClone(resources),bookings:[{id:'BK-DEMO-1',resourceId:'esp32',resourceName:'ESP32 IoT Starter Kit',userId:'student-1',userName:'Aarav Menon',date:date(1),start:'10:00',end:'12:00',purpose:'IoT prototype for semester project',status:'approved',createdAt:iso(),reason:'Approved — resource policy satisfied.'},{id:'BK-DEMO-2',resourceId:'scope',resourceName:'Digital Oscilloscope',userId:'student-2',userName:'Diya Sharma',date:date(1),start:'14:00',end:'15:00',purpose:'Signal analysis for communications lab',status:'pending',createdAt:iso()},{id:'BK-DEMO-3',resourceId:'camera',resourceName:'DSLR Camera Kit',userId:'student-3',userName:'Kabir Das',date:date(2),start:'11:00',end:'13:00',purpose:'Document the robotics project',status:'pending',createdAt:iso()}],incidents:[],audit:[{id:uid('evt'),actor:'System',action:'Demo workspace initialised',target:'CampusShare X',detail:'Loaded fictional inventory and workflow examples.',createdAt:iso()},{id:uid('evt'),actor:'Dr. Meera Iyer',action:'Resource listed',target:'ESP32 IoT Starter Kit',detail:'Access policy: no prerequisite training.',createdAt:iso()},{id:uid('evt'),actor:'Dr. Meera Iyer',action:'Booking approved',target:'ESP32 IoT Starter Kit',detail:'Aarav Menon · IoT prototype for semester project.',createdAt:iso()}]}}
let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')||seed()}catch{data=seed()}
let role='student',page='overview',query='',category='All resources',goal='I need to build an IoT prototype and test a sensor circuit today.',matched=false,modal=null;
const root=document.querySelector('#root'),modalZone=document.querySelector('#modal-zone'),toastZone=document.querySelector('#toast-zone');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});const fullDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});const ago=d=>{let m=Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/60000));return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};
const active=['pending','approved','checked_out'];const eligible=(r,userId=current().id)=>r.training.every(t=>(trained[userId]||[]).includes(t));function current(){return users[role]};function resource(id){return data.resources.find(r=>r.id===id)};function audit(action,target,detail,actor=current().name){data.audit.unshift({id:uid('evt'),actor,action,target,detail,createdAt:iso()});persist()};function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{ /* restricted file origins can still run this in-memory demo */ }};function toast(s){toastZone.innerHTML=`<div class="toast"><span class="toast-check">✓</span><span>${safe(s)}</span><button class="icon-button" data-action="dismiss-toast">×</button></div>`;setTimeout(()=>{toastZone.innerHTML=''},3400)};
function badge(status){const labels={pending:'Pending review',approved:'Approved',rejected:'Declined',waitlisted:'Waitlisted',checked_out:'Checked out',returned:'Returned',cancelled:'Cancelled',available:'Available',maintenance:'Maintenance',inactive:'Inactive',open:'Open',in_review:'In review',resolved:'Resolved'};const tones={pending:'amber',approved:'green',rejected:'red',waitlisted:'violet',checked_out:'blue',returned:'neutral',cancelled:'neutral',available:'green',maintenance:'amber',inactive:'red',open:'red',in_review:'amber',resolved:'green'};return `<span class="badge badge-${tones[status]||'neutral'}">${labels[status]||status}</span>`}
const navItems=[['overview','⌂','Overview','Workspace'],['explore','⌕','Explore resources','Workspace'],['bookings','▦','My bookings','Workspace'],['manage','▣','Owner console','Management'],['passport','▤','Resource passport','Management'],['insights','▥','Insights & analytics','Management']];
function visibleNav(){return navItems.filter(n=>role!=='student'||!['manage','insights'].includes(n[0]))}
function iconTile(r,large=false){return `<div class="${large?'resource-icon-large':'inventory-icon'} gradient-${r.gradient}"><span class="icon-glyph">${r.icon}</span></div>`}
function resourceScore(r){const text=(goal+' '+query).toLowerCase();const caps=[];if(/iot|sensor|arduino|esp32|microcontroller|prototype|circuit/.test(text))caps.push('iot','sensor','microcontroller','prototype','electronics','circuit');if(/video|record|camera|document/.test(text))caps.push('video','camera','recording','documentation');if(/meeting|team|presentation/.test(text))caps.push('meeting','team','presentation','collaboration');if(/test|measure|debug|signal/.test(text))caps.push('testing','measurement','signal','debugging','circuit');if(!caps.length)text.split(/\W+/).filter(w=>w.length>3).forEach(w=>caps.push(w));const matching=new Set(r.tags.filter(t=>caps.some(q=>t.includes(q)||q.includes(t))));return Math.max(42,Math.min(99,Math.round(matching.size/Math.max(3,new Set(caps).size*.38)*100)))}
function min(t){const [h,m]=t.split(':').map(Number);return h*60+m};function conflict(rid,d,s,e,ignore){return data.bookings.find(b=>b.resourceId===rid&&b.id!==ignore&&b.date===d&&active.includes(b.status)&&min(s)<min(b.end)&&min(e)>min(b.start))};
function stat(icon,label,value,note,tone){return `<div class="stat-card"><div class="stat-icon tone-${tone}"><span class="icon-glyph">${icon}</span></div><div class="stat-content"><span>${label}</span><strong>${value}</strong><small>${note}</small></div><div class="stat-corner">↗</div></div>`};function mini(icon,label,value,tone){return `<div class="mini-summary"><div class="mini-summary-icon tone-${tone}"><span class="icon-glyph">${icon}</span></div><div><span>${label}</span><strong>${value}</strong></div></div>`};
function resourceCard(r){const score=resourceScore(r);return `<article class="resource-card"><div class="resource-card-art gradient-${r.gradient}"><div class="art-pattern"></div>${iconTile(r,true)}<div class="resource-art-badges"><span class="badge">${safe(r.category)}</span>${matched?`<span class="badge badge-violet">✦ ${score}% match</span>`:''}</div><span class="asset-label">${safe(r.asset)}</span></div><div class="resource-card-body"><div class="resource-card-head"><h3>${safe(r.name)}</h3>${badge(r.status)}</div><p class="resource-description">${safe(r.desc)}</p><div class="resource-location">⌖ <span>${safe(r.location)}</span></div><div class="resource-tags">${r.tags.slice(0,3).map(t=>`<span>${safe(t)}</span>`).join('')}${r.tags.length>3?`<span>+${r.tags.length-3}</span>`:''}</div><div class="access-requirement ${r.training.length?'restricted':''}">${r.training.length?'⚠':'✓'} <span>${r.training.length?'Training required':'No prerequisite training configured'}</span></div><div class="resource-card-actions"><button class="button button-secondary" data-action="detail" data-id="${r.id}">View details</button><button class="button button-primary" data-action="request" data-id="${r.id}" ${r.status!=='available'||!eligible(r)?'disabled':''}>${!eligible(r)?'Restricted':r.status!=='available'?'Unavailable':'Request'} →</button></div></div></article>`}
function rowRec(r){return `<div class="recommendation-row"><div class="resource-visual gradient-${r.gradient}"><span class="icon-glyph">${r.icon}</span></div><div class="recommendation-info"><div class="recommendation-title"><strong>${safe(r.name)}</strong><span class="match-percentage">✦ ${resourceScore(r)}% match</span></div><p>${safe(r.desc)}</p><div class="recommendation-meta"><span>⌖ ${safe(r.location)}</span>${r.training.length?'<span class="restriction-meta">♙ Training required</span>':''}</div></div><div class="recommendation-actions"><button class="icon-button small" data-action="detail" data-id="${r.id}">›</button><button class="button button-secondary button-sm" data-action="request" data-id="${r.id}" ${!eligible(r)||r.status!=='available'?'disabled':''}>${!eligible(r)?'Restricted':r.status!=='available'?'Unavailable':'Request'}</button></div></div>`}
function auditList(events){return events.length?`<div class="audit-list">${events.map(e=>`<div class="audit-item"><div class="audit-marker">◷</div><div class="audit-copy"><div><strong>${safe(e.action)}</strong><span>${ago(e.createdAt)}</span></div><p>${safe(e.target)} · ${safe(e.detail)}</p><small>By ${safe(e.actor)}</small></div></div>`).join('')}</div>`:'<div class="empty-note">No audit events recorded yet.</div>'}
function heading(eyebrow,title,subtitle,right=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="page-subtitle">${subtitle}</p></div><div class="heading-right">${right}</div></div>`}
function appFrame(content){const u=current(),pend=data.bookings.filter(b=>b.status==='pending').length,open=data.incidents.filter(i=>i.status!=='resolved'&&(role!=='student'||i.reporter===u.name)).length;return `<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark"><span class="icon-glyph">▣</span></div><div class="brand-text"><span>CampusShare</span><small>RESOURCE EXCHANGE</small></div></div><div class="workspace-picker"><div class="workspace-icon">AV</div><div class="workspace-info"><strong>Amrita Campus</strong><small>Institution workspace</small></div><span>⌄</span></div><nav class="side-nav">${['Workspace','Management'].map(g=>{const its=visibleNav().filter(n=>n[3]===g);return its.length?`<div class="nav-group"><div class="nav-caption">${g}</div>${its.map(n=>`<button class="nav-link ${page===n[0]?'active':''}" data-action="nav" data-page="${n[0]}"><span class="icon-glyph">${n[1]}</span><span>${n[2]}</span>${n[0]==='manage'&&pend?`<span class="nav-count">${pend}</span>`:''}</button>`).join('')}</div>`:''}).join('')}</nav><div class="sidebar-bottom"><div class="help-card"><div class="help-icon">ⓘ</div><strong>Need a hand?</strong><p>Learn how safe sharing works across campus.</p><button data-action="quickguide">View quick guide →</button></div><div class="sidebar-foot"><span class="online-dot"></span> Demo workspace · local data</div></div></aside><main class="main-area"><header class="topbar"><div class="topbar-left"><div class="breadcrumb"><span>Amrita Campus</span> › <strong>${({overview:'Overview',explore:'Explore resources',bookings:role==='student'?'My bookings':'Booking activity',manage:'Owner console',passport:'Resource passport',insights:'Insights & analytics'})[page]}</strong></div></div><div class="topbar-actions"><div class="demo-label"><span class="demo-dot"></span> DEMO MODE</div><div class="user-switch"><span class="avatar">${u.initials}</span><div class="user-switch-info"><strong>${u.name}</strong><small>${u.title}</small></div><select id="role-select" aria-label="Switch demo role"><option value="student" ${role==='student'?'selected':''}>Student</option><option value="owner" ${role==='owner'?'selected':''}>Resource owner</option><option value="admin" ${role==='admin'?'selected':''}>Administrator</option></select></div></div></header><div class="page-wrap">${content}</div><footer class="app-footer"><div class="footer-brand"><div class="brand-mark mini">▣</div><span>CampusShare X</span><span class="footer-dot">·</span><span>Trust the handover.</span></div><div><span>Fictional demo data</span><span class="footer-dot">·</span><button data-action="securitynote">Security & deployment note</button></div></footer></main></div>`}
function overview(){const u=current(),mine=data.bookings.filter(b=>b.userId===u.id&&['approved','checked_out','pending','waitlisted'].includes(b.status));return `<div class="welcome-row"><div><div class="eyebrow">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()}</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${u.name.split(' ')[0]} <span class="wave">✦</span></h1><p class="page-subtitle">Make more of what's already on campus.</p></div><button class="button button-secondary" data-action="reset">↻ Reset demo data</button></div><section class="hero-panel"><div class="hero-content"><div class="hero-chip">✦ SMART RESOURCE DISCOVERY</div><h2>Find the right resource.<br><span>Make your next idea happen.</span></h2><p>Describe your project and SmartMatch will connect you with relevant campus resources, with access rules and availability clearly explained.</p><div class="hero-search"><span class="icon-glyph">✦</span><input id="goal-overview" value="${safe(goal)}" placeholder="e.g. I need to prototype an IoT sensor..."><button class="button button-primary" data-action="smartsearch">Find resources →</button></div><div class="hero-quick-tags"><span>Try:</span><button data-action="goal" data-goal="I need to build an IoT prototype and test a sensor circuit today.">IoT prototyping</button><button data-action="goal" data-goal="I need to record a project demo video.">Project video</button><button data-action="goal" data-goal="I need a room for a team project meeting.">Team meeting</button></div></div><div class="hero-art"><div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div><div class="art-center"><span class="icon-glyph">▣</span></div><div class="floating-tile tile-cpu">⌘ <span>IoT kits</span></div><div class="floating-tile tile-shield">♢ <span>Trusted access</span></div><div class="floating-tile tile-chart">▥ <span>Resource impact</span></div><div class="art-caption"><span class="caption-dot"></span> One connected sharing lifecycle</div></div></section><div class="stats-grid">${stat('▣','Listed resources',String(data.resources.length).padStart(2,'0'),'Across campus','violet')}${stat('◷','Pending requests',String(data.bookings.filter(b=>b.status==='pending').length).padStart(2,'0'),role==='student'?'Awaiting owner review':'Require your attention','amber')}${stat('▤','Currently checked out',String(data.bookings.filter(b=>b.status==='checked_out').length).padStart(2,'0'),'Active handovers','blue')}${stat('♢','Open incidents',String(data.incidents.filter(i=>i.status!=='resolved'&&(role!=='student'||i.reporter===u.name)).length).padStart(2,'0'),'Human review required','green')}</div><div class="content-grid overview-grid"><section class="panel"><div class="panel-head"><div><h3>Recommended for you</h3><p>Selected for project work and prototyping</p></div><button class="text-button" data-action="nav" data-page="explore">Explore all →</button></div><div class="recommendations-list">${['esp32','sensor','meter'].map(id=>resource(id)).map(rowRec).join('')}</div><div class="panel-footnote">♢ Recommendations are not availability confirmations. Dates are checked before request.</div></section><section class="panel"><div class="panel-head"><div><h3>Your next booking</h3><p>Keep your sharing activity on track</p></div><button class="icon-button small" data-action="nav" data-page="bookings">→</button></div>${mine.length?mine.slice(0,2).map(b=>`<div class="upcoming-item"><div class="date-tile"><span>${new Date(b.date+'T12:00:00').toLocaleDateString('en-IN',{month:'short'}).toUpperCase()}</span><strong>${new Date(b.date+'T12:00:00').getDate()}</strong></div><div class="upcoming-info"><strong>${safe(b.resourceName)}</strong><span>◷ ${b.start}–${b.end} · ${when(b.date)}</span>${badge(b.status)}</div><span class="muted-arrow">›</span></div>`).join(''):`<div class="empty-state compact"><div class="empty-illustration">▦</div><strong>No upcoming bookings</strong><p>Explore the catalogue to find your next resource.</p><button class="button button-secondary button-sm" data-action="nav" data-page="explore">Explore resources</button></div>`}<div class="trust-note"><div class="trust-symbol">♢</div><div><strong>Every handover counts</strong><p>Condition reports and activity history keep resource sharing transparent.</p><button data-action="nav" data-page="passport">View resource passport →</button></div></div></section></div><div class="bottom-banner"><div class="banner-icon">▤</div><div><strong>Make every handover accountable</strong><p>Resource Passport records the before-and-after condition of shared equipment.</p></div><button class="button button-secondary" data-action="nav" data-page="passport">Explore passports →</button></div>`}
function explore(){const cats=['All resources',...new Set(data.resources.map(r=>r.category))];let list=data.resources.filter(r=>(category==='All resources'||category===r.category)&&(!query||`${r.name} ${r.desc} ${r.category} ${r.location} ${r.tags.join(' ')}`.toLowerCase().includes(query.toLowerCase())));if(matched)list.sort((a,b)=>resourceScore(b)-resourceScore(a));return `${heading('DISCOVER · REQUEST · SHARE','Explore resources','Find the equipment and spaces that help bring your project to life.','<button class="button button-secondary" data-action="clearfilters">↻ Reset filters</button>')}<section class="smartmatch-card"><div class="smartmatch-icon">✦</div><div class="smartmatch-main"><div class="smartmatch-title"><div><strong>SmartMatch AI</strong><span class="badge badge-violet">Project-aware search</span></div><span>Recommendations are explainable · eligibility enforced separately</span></div><div class="smartmatch-input"><input id="goal-explore" value="${safe(goal)}" placeholder="Describe your project or what you want to do..."><button class="button button-primary" data-action="smartsearch">✦ Match resources</button></div><div class="smartmatch-hints"><span>Popular goals</span><button data-action="goal" data-goal="I need to build an IoT prototype and test a sensor circuit today.">IoT prototyping</button><button data-action="goal" data-goal="I need to record a project demo video.">Project video</button><button data-action="goal" data-goal="I need a room for a team project meeting.">Team collaboration</button></div></div></section>${matched?'<div class="match-summary"><div class="match-summary-icon">✦</div><div><strong>Matched to your project goal</strong><p>Ranked by capability relevance. Access restrictions and selected-time availability are checked separately.</p></div><span class="badge badge-green">Explainable matches</span></div>':''}<div class="catalog-toolbar"><div class="catalog-count"><strong>${list.length} resources</strong><span>in campus catalogue</span></div><div class="catalog-filters"><div class="search-field">⌕ <input id="catalog-query" value="${safe(query)}" placeholder="Search resources, tags, locations..."><button class="icon-button small" data-action="applyquery">↵</button></div><select id="category-select">${cats.map(c=>`<option ${c===category?'selected':''}>${safe(c)}</option>`).join('')}</select></div></div><div class="resource-grid">${list.map(resourceCard).join('')}</div>${!list.length?'<div class="empty-state"><div class="empty-illustration">⌕</div><h3>No resources found</h3><p>Try a different search or clear the category filter.</p><button class="button button-secondary" data-action="clearfilters">Clear filters</button></div>':''}<div class="catalog-note">♢ <span><strong>Trust by design.</strong> SmartMatch provides recommendations; the booking workflow verifies eligibility and current schedule before accepting a request.</span></div>`}
function bookingActions(b){const owner=role!=='student',mine=b.userId===current().id;if(b.status==='pending'&&owner)return `<div class="table-actions"><button class="tiny-action approve" data-action="approve" data-id="${b.id}">✓</button><button class="tiny-action decline" data-action="reject" data-id="${b.id}">×</button></div>`;if(b.status==='waitlisted'&&owner)return `<button class="button button-secondary button-sm" data-action="review" data-id="${b.id}">Review</button>`;if(b.status==='approved'&&(mine||owner))return `<button class="button button-primary button-sm" data-action="checkin" data-id="${b.id}">Check in</button>`;if(b.status==='checked_out'&&(mine||owner))return `<button class="button button-secondary button-sm" data-action="return" data-id="${b.id}">Return</button>`;if(['pending','approved','waitlisted'].includes(b.status)&&mine)return `<button class="button button-ghost-danger button-sm" data-action="cancel" data-id="${b.id}">Cancel</button>`;if(b.status==='returned'&&mine)return `<button class="button button-ghost button-sm" data-action="incident" data-id="${b.id}">Report issue</button>`;return '<span class="muted-dash">—</span>'}
function bookings(){const all=role==='student'?data.bookings.filter(b=>b.userId===current().id):data.bookings;return `${heading('YOUR RESOURCE ACTIVITY',role==='student'?'My bookings':'Booking activity',role==='student'?'Track decisions, upcoming handovers and returns in one place.':'Review booking status across the campus demo workspace.','<button class="button button-primary" data-action="nav" data-page="explore">＋ New request</button>')}<div class="booking-summary-row">${mini('◷','Awaiting review',all.filter(b=>b.status==='pending').length,'amber')}${mini('✓','Approved',all.filter(b=>b.status==='approved').length,'green')}${mini('▤','Checked out',all.filter(b=>b.status==='checked_out').length,'blue')}${mini('▧','Completed',all.filter(b=>b.status==='returned').length,'violet')}</div><section class="panel booking-panel"><div class="panel-head"><div><h3>Booking activity</h3><p>${role==='student'?'Your requests and active bookings':'All demo bookings across the institution'}</p></div><div class="inline-legend"><span>● Approved</span><span>● Pending</span></div></div>${all.length?`<div class="table-wrap"><table><thead><tr><th>Resource</th>${role!=='student'?'<th>Requester</th>':''}<th>Date & time</th><th>Purpose</th><th>Status</th><th>Next action</th></tr></thead><tbody>${[...all].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(b=>`<tr><td><div class="table-resource"><span class="table-resource-icon">▣</span><div><strong>${safe(b.resourceName)}</strong><small>${safe(b.id.toUpperCase())}</small></div></div></td>${role!=='student'?`<td><div class="table-person"><span class="avatar">${safe(b.userName.split(' ').map(n=>n[0]).slice(0,2).join(''))}</span><span>${safe(b.userName)}</span></div></td>`:''}<td><strong>${when(b.date)}</strong><small class="table-subline">${b.start}–${b.end}</small></td><td class="purpose-cell">${safe(b.purpose)}</td><td>${badge(b.status)}</td><td>${bookingActions(b)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><div class="empty-illustration">▦</div><h3>No bookings yet</h3><p>Explore the catalogue to request your first resource.</p><button class="button button-secondary" data-action="nav" data-page="explore">Explore resources</button></div>'}</section><div class="policy-inline">♢ <div><strong>Approval does not bypass resource policy</strong><p>Eligibility is checked before request and at approval. Conflicting active bookings cannot be approved.</p></div></div>`}
function manage(){const pending=data.bookings.filter(b=>['pending','waitlisted'].includes(b.status));return `${heading('OPERATIONS WORKSPACE','Owner console','Manage assets, make transparent decisions and keep handovers moving.','<button class="button button-primary" data-action="addresource">＋ List a resource</button>')}<div class="owner-kpis">${mini('▣','My listed resources',data.resources.length,'violet')}${mini('☷','Pending decisions',data.bookings.filter(b=>b.status==='pending').length,'amber')}${mini('▤','Out with users',data.bookings.filter(b=>b.status==='checked_out').length,'blue')}${mini('⚒','Maintenance items',data.resources.filter(r=>r.status==='maintenance').length,'red')}</div><div class="content-grid manage-grid"><section class="panel"><div class="panel-head"><div><h3>Requests requiring attention</h3><p>Review eligibility and schedule before approval.</p></div><span class="badge badge-amber">${pending.length} pending</span></div><div class="request-stack">${pending.length?pending.map(b=>{const r=resource(b.resourceId),ok=r&&eligible(r,b.userId);return `<div class="request-card"><div class="request-user"><span class="avatar">${b.userName.split(' ').map(n=>n[0]).slice(0,2).join('')}</span><div><strong>${safe(b.userName)}</strong><small>${safe(b.purpose)}</small></div>${badge(b.status)}</div><div class="request-details"><span>▣ ${safe(b.resourceName)}</span><span>▦ ${when(b.date)} · ${b.start}–${b.end}</span></div>${r&&r.training.length?`<div class="eligibility-banner ${ok?'pass':'block'}">⚠ <span>${ok?'Training policy passed.':'Eligibility blocked: required training not verified.'}</span></div>`:''}<div class="request-actions">${b.status==='pending'?`<button class="button button-primary button-sm" data-action="approve" data-id="${b.id}" ${!ok?'disabled':''}>✓ Approve</button><button class="button button-secondary button-sm" data-action="waitlist" data-id="${b.id}">Waitlist</button><button class="button button-ghost-danger button-sm" data-action="reject" function passport(){const inc=data.incidents.filter(i=>role!=='student'||i.reporter===current().name||data.bookings.some(b=>b.id===i.bookingId&&b.userId===current().id));const logs=data.audit.filter(e=>role!=='student'||e.actor===current().name||data.bookings.some(b=>b.userId===current().id&&b.resourceName===e.target));return `${heading('TRACEABILITY & ACCOUNTABILITY','Resource passport','Every shared asset has a history. Every handover is recorded.','<button class="button button-secondary" data-action="export">⇩ Export audit CSV</button>')}<div class="passport-stats">${mini('◷','Audit events',data.audit.length,'violet')}${mini('▤','Condition reports',data.bookings.filter(b=>b.before||b.after).length,'blue')}${mini('⚠','Open incidents',inc.filter(i=>i.status!=='resolved').length,'red')}</div><section class="panel"><div class="panel-head"><div><h3>Asset passports</h3><p>Identity, policy, condition history and lifecycle events</p></div><div class="search-field compact-search">⌕ <input id="passport-search" value="${safe(query)}" placeholder="Find an asset..."></div></div><div class="passport-grid">${data.resources.filter(r=>!query||`${r.name} ${r.asset} ${r.location}`.toLowerCase().includes(query.toLowerCase())).map(r=>`<button class="passport-card" data-action="detail" data-id="${r.id}"><div class="passport-card-top">${iconTile(r)}${badge(r.status)}</div><div class="eyebrow">${safe(r.asset)}</div><h4>${safe(r.name)}</h4><p>⌖ ${safe(r.location)}</p><div class="passport-card-foot"><span>◷ ${data.audit.filter(e=>e.target===r.name).length} recorded events</span> →</div></button>`).join('')}</div></section><div class="content-grid passport-bottom"><section class="panel"><div class="panel-head"><div><h3>Incident register</h3><p>Reports require authorised human review</p></div><span class="badge badge-${inc.some(i=>i.status!=='resolved')?'red':'green'}">${inc.filter(i=>i.status!=='resolved').length} open</span></div>${inc.length?`<div class="incident-list">${inc.map(i=>`<div class="incident-item"><div class="incident-icon ${i.severity}">⚠</div><div class="incident-content"><div class="incident-title"><strong>${safe(i.resourceName)}</strong>${badge(i.status)}</div><p>${safe(i.description)}</p><small>Reported by ${safe(i.reporter)} · ${ago(i.createdAt)} · ${i.severity} severity</small>${i.resolution?`<div class="resolution-note">✓ Resolution: ${safe(i.resolution)}</div>`:''}</div>${i.status!=='resolved'&&role!=='student'?`<button class="button button-secondary button-sm" data-action="resolve" data-id="${i.id}">Resolve</button>`:''}</div>`).join('')}</div>`:'<div class="empty-state compact"><span class="icon-glyph">♢</span><strong>No incidents reported</strong><p>Any condition issue reported at return will appear here.</p></div>'}</section><section class="panel"><div class="panel-head"><div><h3>Audit history</h3><p>Recent access and lifecycle events</p></div><button class="icon-button small" data-action="export">⇩</button></div>${auditList(logs.slice(0,8))}</section></div>`}
function insights(){let cats=[...new Set(data.resources.map(r=>r.category))];let max=Math.max(...cats.map(c=>data.resources.filter(r=>r.category===c).length));return `${heading('INSTITUTIONAL IMPACT','Insights & analytics','Understand how resources are used and where access can improve.','<span class="badge badge-blue">Demo dataset</span>')}<div class="insight-banner"><div class="insight-banner-icon">▥</div><div><strong>Turn idle assets into measurable opportunity.</strong><p>Analytics are calculated from local demo records, not real institutional performance data.</p></div></div><div class="stats-grid analytics-stats">${stat('▣','Resources listed',data.resources.length,'Current demo inventory','violet')}${stat('↗','Average uses per asset',Math.round(data.resources.reduce((s,r)=>s+r.uses,0)/data.resources.length),'Seeded usage counts','blue')}${stat('✓','Return compliance',data.bookings.some(b=>b.status==='returned')?'100%':'—','Requires completed returns','green')}${stat('◷','Awaiting decision',data.bookings.filter(b=>b.status==='pending').length,'Pending requests','amber')}</div><div class="content-grid analytics-grid"><section class="panel"><div class="panel-head"><div><h3>Catalogue by category</h3><p>Resource inventory distribution</p></div></div><div class="category-bars">${cats.map(c=>{let n=data.resources.filter(r=>r.category===c).length;return `<div class="bar-row"><div class="bar-label"><span>${safe(c)}</span><strong>${n}</strong></div><div class="bar-track"><div class="bar-fill fill-violet" style="width:${n/max*100}%"></div></div></div>`}).join('')}</div></section><section class="panel"><div class="panel-head"><div><h3>Lifecycle snapshot</h3><p>Bookings by current status</p></div></div><div class="lifecycle-list">${[['Pending review','pending','amber'],['Approved','approved','green'],['Checked out','checked_out','blue'],['Returned','returned','violet'],['Waitlisted','waitlisted','rose']].map(([l,s,c])=>`<div class="lifecycle-row"><span class="lifecycle-dot ${c}"></span><span>${l}</span><strong>${data.bookings.filter(b=>b.status===s).length}</strong></div>`).join('')}</div><div class="analytics-foot">♢ <span>Use this view to identify bottlenecks. Validate conclusions against real usage data.</span></div></section></div><section class="panel"><div class="panel-head"><div><h3>Resource demand signals</h3><p>Seeded usage counts for demonstration only</p></div></div><div class="demand-table">${[...data.resources].sort((a,b)=>b.uses-a.uses).slice(0,5).map((r,i)=>`<div class="demand-row"><span class="rank-number">0${i+1}</span>${iconTile(r)}<div class="demand-resource"><strong>${safe(r.name)}</strong><small>${safe(r.category)} · ${safe(r.location)}</small></div><div class="demand-meter"><div class="bar-track"><div class="bar-fill fill-violet" style="width:${r.uses/Math.max(...data.resources.map(x=>x.uses))*100}%"></div></div></div><strong class="uses-number">${r.uses}<small> uses</small></strong></div>`).join('')}</div></section>`}
function render(){let content=({overview,explore,bookings,manage,passport,insights})[page]();root.innerHTML=appFrame(content);}
function showModal(title,eyebrow,body,wide=false){modalZone.innerHTML=`<div class="modal-overlay" data-action="backdrop"><div class="modal ${wide?'modal-wide':''}" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div><button class="icon-button" data-action="close">×</button></div>${body}</div></div>`;}
function openBooking(r){if(r.status!=='available'){toast('This resource is not available for new requests.');return}if(!eligible(r)){toast('Access blocked: complete required training before requesting this resource.');return}let start=new Date();start.setMinutes(0,0,0);start.setHours(start.getHours()+1);if(start.getHours()>21){start.setDate(start.getDate()+1);start.setHours(10)}let end=new Date(start);end.setHours(start.getHours()+2);const fmt=d=>`${String(d.getHours()).padStart(2,'0')}:00`;const startDate=dateFor(start);showModal('Request this resource','BOOKING REQUEST',`<form id="booking-form" data-id="${r.id}"><div class="modal-resource-summary">${iconTile(r)}<div><strong>${safe(r.name)}</strong><small>⌖ ${safe(r.location)}</small></div>${badge(r.status)}</div><div class="form-field"><label>Project purpose</label><textarea name="purpose" rows="2">${safe(goal||'Project work')}</textarea></div><div class="form-grid"><div class="form-field"><label>Requested date</label><input name="date" type="date" required min="${date(0)}" value="${startDate}"></div><div class="form-field"><label>Start time</label><input name="start" type="time" required value="${fmt(start)}"></div><div class="form-field"><label>End time</label><input name="end" type="time" required value="${fmt(end)}"></div></div><div class="form-info">♢ <span>Eligibility is checked before request. The demo checks local booking records for time conflicts.</span></div><div class="modal-actions"><button class="button button-secondary" type="button" data-action="close">Cancel</button><button class="button button-primary" type="submit">Submit request →</button></div></form>`)}
function detail(r){const ev=data.audit.filter(e=>e.target===r.name).slice(0,4);showModal(r.name,`RESOURCE PASSPORT · ${r.asset}`,`<div class="detail-hero"><div class="detail-art gradient-${r.gradient}"><span class="icon-glyph">${r.icon}</span></div><div class="detail-main"><div class="detail-badges"><span class="badge badge-blue">${r.category}</span>${badge(r.status)}</div><p>${safe(r.desc)}</p><div class="detail-meta"><span>⌖ ${safe(r.location)}</span><span>♙ Owner: ${safe(r.owner)}</span><span>◷ ${r.uses} recorded uses <em>(seeded)</em></span></div></div></div><div class="detail-sections"><section><h4>Capabilities</h4><div class="tag-list">${r.tags.map(t=>`<span class="capability-tag">${safe(t)}</span>`).join('')}</div></section><section><h4>Eligibility requirements</h4><div class="requirement-block ${r.training.length?'':'success'}">${r.training.length?'⚠':'♢'}<div><strong>${r.training.length?'Mandatory training':'No prerequisite training configured'}</strong><p>${r.training.length?safe(r.training.join(', ').replace(/-/g,' '))+' must be verified before access.':'Other institutional policies still apply.'}</p></div></div></section><section><h4>Usage & return instructions</h4><p class="detail-instructions">${safe(r.instructions)}</p></section><section><h4>Passport activity</h4>${auditList(ev)}</section></div><div class="modal-actions"><button class="button button-secondary" data-action="close">Close</button><button class="button button-primary" data-action="request" data-id="${r.id}" ${!eligible(r)||r.status!=='available'?'disabled':''}>Request resource →</button></div>`,true)}
function conditionModal(id,stage){let b=data.bookings.find(x=>x.id===id);if(!b)return;showModal(stage==='before'?'Record check-in condition':'Confirm resource return',stage==='before'?'RESOURCE HANDOVER':'RESOURCE RETURN',`<form id="condition-form" data-id="${b.id}" data-stage="${stage}"><div class="condition-resource"><div class="condition-icon">▤</div><div><strong>${safe(b.resourceName)}</strong><small>${safe(b.userName)} · ${fullDate(b.date)}</small></div></div><div class="form-field"><label>${stage==='before'?'Initial condition':'Condition at return'}</label><div class="condition-options"><label class="condition-option selected"><input type="radio" name="condition" value="good" checked><strong>Good</strong><small>No issue noted</small></label><label class="condition-option"><input type="radio" name="condition" value="minor"><strong>Minor issue</strong><small>Needs a note</small></label><label class="condition-option"><input type="radio" name="condition" value="damage"><strong>Damage / missing</strong><small>Manager review</small></label></div></div><div class="form-field"><label>Condition notes <span class="required-label" id="condition-required" hidden>Required for an issue</span></label><textarea name="notes" rows="3" placeholder="Describe what you observed. Avoid assumptions about responsibility."></textarea></div><div class="form-info">♢ <span>A discrepancy is reviewed by an authorised person. It does not automatically assign blame or impose a penalty.</span></div><div class="modal-actions"><button type="button" class="button button-secondary" data-action="close">Cancel</button><button type="submit" class="button button-primary">${stage==='before'?'Confirm check-in':'Confirm return'} →</button></div></form>`)}
function incidentModal(id){const b=data.bookings.find(x=>x.id===id);showModal('Report an incident','RESOURCE SAFETY & ACCOUNTABILITY',`<form id="incident-form" data-id="${b?.id||''}">${b?`<div class="condition-resource"><div class="condition-icon danger">⚠</div><div><strong>${safe(b.resourceName)}</strong><small>Submitted for authorised human review</small></div></div>`:''}<div class="form-field"><label>Severity</label><select name="severity"><option value="low">Low — minor issue</option><option value="medium" selected>Medium — needs investigation</option><option value="high">High — safety or damage concern</option></select></div><div class="form-field"><label>What happened? *</label><textarea name="description" rows="4" required placeholder="Describe what you observed, when it happened and any immediate action taken."></textarea></div><div class="form-info">♢ <span>Report facts, not assumptions. An authorised manager will review the information before a decision.</span></div><div class="modal-actions"><button type="button" class="button button-secondary" data-action="close">Cancel</button><button type="submit" class="button button-primary">Submit incident →</button></div></form>`)}
function resourceModal(){showModal('List a resource','RESOURCE INVENTORY',`<form id="resource-form"><div class="form-field"><label>Resource name *</label><input name="name" required placeholder="e.g. ESP32 IoT starter kit"></div><div class="form-grid"><div class="form-field"><label>Category</label><select name="category"><option>Electronics</option><option>Testing</option><option>Computing</option><option>Media</option><option>Spaces</option><option>Lab equipment</option></select></div><div class="form-field"><label>Location *</label><input name="location" required placeholder="Building / room"></div></div><div class="form-field"><label>Description</label><textarea name="desc" rows="2" placeholder="What is this resource used for?"></textarea></div><div class="form-field"><label>Capability tags (comma-separated)</label><input name="tags" value="iot, electronics, prototype"></div><div class="form-field"><label>Required training ID (optional)</label><input name="training" placeholder="e.g. lab-safety"></div><div class="form-info">♢ <span>This creates a resource in the local demo inventory. Production listings require authenticated owner permission.</span></div><div class="modal-actions"><button type="button" class="button button-secondary" data-action="close">Cancel</button><button type="submit" class="button button-primary">Add resource +</button></div></form>`)}
function approve(id,status,reason){const b=data.bookings.find(x=>x.id===id);if(!b)return;const r=resource(b.resourceId);if(['approved','rejected','waitlisted'].includes(status)&&role==='student'){toast('Only an authorised owner or administrator can make this decision.');return}if(status==='approved'){if(!r||!eligible(r,b.userId)){toast('Cannot approve: requester eligibility is not verified.');return}const c=conflict(b.resourceId,b.date,b.start,b.end,b.id);if(c){toast('Cannot approve: this slot conflicts with another active request.');return}}b.status=status;b.reason=reason|| (status==='approved'?'Approved by the resource owner.':b.reason);audit('Booking '+status.replace(/_/g,' '),b.resourceName,reason||`${b.userName} · ${fullDate(b.date)}`);persist();render();toast('Booking marked '+status.replace(/_/g,' ')+'.')}
function submitBookingForm(form){const fd=new FormData(form),id=form.dataset.id,r=resource(id),d=fd.get('date'),s=fd.get('start'),e=fd.get('end');if(!r)return;if(!d||!s||!e||min(e)<=min(s)){toast('Choose a valid date and end time after the start time.');return}if(!eligible(r)){toast('Eligibility changed. This resource cannot be requested.');closeModal();return}const c=conflict(id,d,s,e);const b={id:uid('bk').toUpperCase(),resourceId:r.id,resourceName:r.name,userId:current().id,userName:current().name,date:d,start:s,end:e,purpose:String(fd.get('purpose')||'Project work'),status:c?'waitlisted':'pending',createdAt:iso(),reason:c?'Added to the queue for the selected time.':undefined};data.bookings.unshift(b);audit(c?'Joined waitlist':'Booking requested',r.name,`${fullDate(d)} · ${s}–${e}`);persist();closeModal();page='bookings';render();toast(c?'You joined the waitlist.':'Booking request submitted for owner review.')}
function submitCondition(form){const id=form.dataset.id,stage=form.dataset.stage,b=data.bookings.find(x=>x.id===id);if(!b)return;const fd=new FormData(form),cond=fd.get('condition'),notes=String(fd.get('notes')||'').trim();if(cond!=='good'&&!notes){toast('Please add condition notes for an issue.');return}if(stage==='before'){b.status='checked_out';b.before=cond;b.beforeNotes=notes;audit('Resource checked out',b.resourceName,'Condition: '+cond+(notes?' · '+notes:''))}else{b.status='returned';b.after=cond;b.afterNotes=notes;audit('Resource returned',b.resourceName,'Condition: '+cond+(notes?' · '+notes:''));if(cond!=='good'){data.incidents.unshift({id:uid('inc'),bookingId:b.id,resourceName:b.resourceName,reporter:current().name,description:notes,severity:cond==='damage'?'high':'low',status:'open',createdAt:iso()});audit('Incident opened',b.resourceName,notes)}}persist();closeModal();render();toast(stage==='before'?'Check-in recorded. Resource is now checked out.':cond==='good'?'Return recorded. Lifecycle completed.':'Return recorded and an incident opened for review.')}
function submitIncidentForm(form){const fd=new FormData(form),b=data.bookings.find(x=>x.id===form.dataset.id);if(!b){toast('Select a related booking first.');return}const desc=String(fd.get('description')||'').trim();if(!desc){toast('Describe the issue before submitting.');return}const inc={id:uid('inc'),bookingId:b.id,resourceName:b.resourceName,reporter:current().name,description:desc,severity:fd.get('severity'),status:'open',createdAt:iso()};data.incidents.unshift(inc);audit('Incident reported',b.resourceName,desc);persist();closeModal();page='passport';render();toast('Incident submitted for authorised review.')}
function addResourceForm(form){if(role==='student'){toast('Only resource owners or admins may list resources.');return}const fd=new FormData(form),name=String(fd.get('name')||'').trim(),loc=String(fd.get('location')||'').trim();if(!name||!loc){toast('Add a resource name and location.');return}const cat=String(fd.get('category'));const r={id:uid('res'),name,category:cat,desc:String(fd.get('desc')||'Institution-managed shared resource.'),location:loc,ownerId:current().id,owner:current().name,tags:String(fd.get('tags')||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),training:String(fd.get('training')||'').trim()?[String(fd.get('training')).trim().replace(/ /g,'-').toLowerCase()]:[],status:'available',icon:cat==='Computing'?'▱':cat==='Media'?'▣':'⌘',gradient:'violet',asset:'CSX-'+Math.random().toString(36).slice(2,6).toUpperCase(),uses:0,instructions:'Follow the owner-provided usage and return instructions.'};data.resources.unshift(r);audit('Resource listed',name,'Location: '+loc);persist();closeModal();render();toast('Resource added to catalogue.')}
function closeModal(){modalZone.innerHTML='';modal=null}
function exportCsv(){const rows=[['Timestamp','Actor','Action','Target','Details'],...data.audit.map(e=>[e.createdAt,e.actor,e.action,e.target,e.detail])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='campushare-audit-log.csv';a.click();URL.revokeObjectURL(a.href);toast('Audit log exported as CSV.')}
function reset(){if(!confirm('Reset this browser demo to the original fictional inventory and sample bookings?'))return;data=seed();persist();role='student';page='overview';query='';category='All resources';matched=false;goal='I need to build an IoT prototype and test a sensor circuit today.';render();toast('Demo data reset successfully.')}
const clickHandler=e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action,id=btn.dataset.id;if(act==='nav'){const p=btn.dataset.page;if(role==='student'&&['manage','insights'].includes(p)){toast('This workspace requires an authorised owner or administrator role.');return}page=p;render()}else if(act==='request'){const r=resource(id);if(r)openBooking(r)}else if(act==='detail'){const r=resource(id);if(r)detail(r)}else if(act==='close'||act==='dismiss-toast')closeModal(),toastZone.innerHTML='';else if(act==='backdrop'&&e.target===btn)closeModal();else if(act==='smartsearch'){const inp=document.querySelector('#goal-overview')||document.querySelector('#goal-explore');if(inp)goal=inp.value;page='explore';matched=true;query='';render()}else if(act==='goal'){goal=btn.dataset.goal;matched=true;page='explore';render()}else if(act==='clearfilters'){query='';category='All resources';matched=false;render()}else if(act==='applyquery'){query=document.querySelector('#catalog-query')?.value||'';render()}else if(act==='approve')approve(id,'approved');else if(act==='reject')approve(id,'rejected','Declined by the resource owner.');else if(act==='waitlist')approve(id,'waitlisted','Placed on the waitlist by the owner.');else if(act==='review')approve(id,'pending','Returned to owner review from waitlist.');else if(act==='checkin')conditionModal(id,'before');else if(act==='return')conditionModal(id,'after');else if(act==='cancel')approve(id,'cancelled','Cancelled by the requester.');else if(act==='incident')incidentModal(id);else if(act==='addresource')resourceModal();else if(act==='resolve'){const i=data.incidents.find(x=>x.id===id);if(!i)return;const note=prompt('Enter a short resolution note for the audit trail:');if(note&&note.trim()){i.status='resolved';i.resolution=note.trim();audit('Incident resolved',i.resourceName,note.trim());persist();render();toast('Incident resolved and recorded.')}}else if(act==='export')exportCsv();else if(act==='reset')reset();else if(act==='securitynote')toast('Production use requires real authentication, database RLS and server-side booking/eligibility validation.');else if(act==='quickguide')toast('Explore → request → owner approval → check-in → return.');};root.addEventListener('click',clickHandler);modalZone.addEventListener('click',clickHandler);toastZone.addEventListener('click',clickHandler);
const changeHandler=e=>{if(e.target.id==='role-select'){role=e.target.value;page=role==='student'&&['manage','insights'].includes(page)?'overview':page;render();toast('Demo view switched to '+current().title+'.')}if(e.target.id==='category-select'){category=e.target.value;render()}if(e.target.id==='passport-search'){query=e.target.value;render()}if(e.target.name==='condition'){document.querySelectorAll('.condition-option').forEach(el=>el.classList.remove('selected','warning-selected','danger-selected'));const label=e.target.closest('.condition-option');label.classList.add('selected');if(e.target.value==='minor')label.classList.add('warning-selected');if(e.target.value==='damage')label.classList.add('danger-selected');const req=document.querySelector('#condition-required');if(req)req.hidden=e.target.value==='good'}};root.addEventListener('change',changeHandler);modalZone.addEventListener('change',changeHandler);
root.addEventListener('input',e=>{if(e.target.id==='catalog-query')query=e.target.value;if(e.target.id==='passport-search')query=e.target.value});
modalZone.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='booking-form')submitBookingForm(form);else if(form.id==='condition-form')submitCondition(form);else if(form.id==='incident-form')submitIncidentForm(form);else if(form.id==='resource-form')addResourceForm(form)});
render();
})();
</script>
